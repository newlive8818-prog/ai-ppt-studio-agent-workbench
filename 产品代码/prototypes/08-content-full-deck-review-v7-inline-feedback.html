<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>全稿视觉决策伴随｜真实案例原型</title>
  <style>
    :root {
      --bg:#eef1f5; --paper:#fff; --paper-2:#f8fafc; --line:#dde3eb; --text:#172033; --muted:#667085;
      --blue:#275fc4; --blue-soft:#edf4ff; --green:#147355; --green-soft:#eaf7f2; --amber:#9a4d0a; --amber-soft:#fff5e8;
      --red:#a93640; --red-soft:#fff0f1; --purple:#5c43a5; --purple-soft:#f2efff; --shadow:0 12px 34px rgba(15,23,42,.09);
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button { font:inherit; }
    .app { width:100%; min-height:100vh; margin:0; background:#f5f7fa; }
    .head { position:sticky; top:0; z-index:30; background:rgba(255,255,255,.97); border-bottom:1px solid var(--line); backdrop-filter:blur(16px); }
    .head-main { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:13px 15px 9px; }
    .project { min-width:0; }
    .project b { display:block; font-size:14px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .project span { display:block; margin-top:3px; color:var(--muted); font-size:10px; }
    .review-progress { flex:none; font-size:10px; color:#465468; }
    .progress { height:3px; background:#e8ecf2; }
    .progress span { display:block; width:41%; height:100%; background:var(--blue); }
    .chapter-nav { display:flex; gap:5px; overflow-x:auto; scrollbar-width:none; padding:8px 12px 10px; }
    .chapter-nav::-webkit-scrollbar { display:none; }
    .nav-btn { flex:none; border:1px solid var(--line); border-radius:999px; padding:6px 9px; background:#fff; color:#596579; font-size:10px; cursor:pointer; }
    .nav-btn:hover,.nav-btn.active { border-color:#aebfe0; background:var(--blue-soft); color:#194da6; }
    .document { padding:16px 18px 48px; }
    .deck-intro { padding:14px; margin-bottom:12px; border-radius:12px; background:#16233a; color:#fff; }
    .deck-intro small { color:#9eacc2; font-size:9px; letter-spacing:.06em; font-weight:700; }
    .deck-intro h1 { margin:5px 0 7px; font-size:18px; line-height:1.35; }
    .deck-intro p { margin:0; color:#cbd5e1; font-size:11px; line-height:1.55; }
    .deck-facts { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
    .deck-facts span { padding:4px 7px; border-radius:999px; background:rgba(255,255,255,.08); color:#cfd8e8; font-size:9px; }
    .chapter { scroll-margin-top:115px; margin-top:22px; }
    .chapter:first-of-type { margin-top:0; }
    .chapter-title { display:grid; grid-template-columns:34px minmax(0,1fr); gap:9px; align-items:start; margin:0 2px 9px; }
    .chapter-no { width:32px; height:32px; display:grid; place-items:center; border-radius:9px; background:#17233a; color:#fff; font-size:10px; font-weight:800; }
    .chapter-title h2 { margin:0 0 3px; font-size:16px; }
    .chapter-title p { margin:0; color:var(--muted); font-size:10px; line-height:1.45; }
    .page { scroll-margin-top:116px; margin-bottom:10px; border:1px solid var(--line); border-radius:12px; background:var(--paper); overflow:hidden; box-shadow:0 3px 12px rgba(15,23,42,.04); }
    .page-head { display:grid; grid-template-columns:38px minmax(0,1fr) auto; gap:9px; align-items:start; padding:12px; border-bottom:1px solid var(--line); }
    .page-no { width:36px; height:38px; display:grid; place-items:center; border-radius:8px; background:#17233a; color:#fff; font-size:10px; font-weight:800; }
    .page-title h3 { margin:0; font-size:14px; line-height:1.4; }
    .page-title p { margin:4px 0 0; color:var(--muted); font-size:10px; line-height:1.4; }
    .mark-dot { width:8px; height:8px; margin-top:3px; border-radius:50%; background:#cbd3df; }
    .mark-dot.approved { background:var(--green); }
    .mark-dot.modify { background:var(--amber); }
    .mark-dot.evidence { background:var(--red); }
    .page-body { display:grid; grid-template-columns:minmax(340px,.9fr) minmax(500px,1.1fr); gap:16px; align-items:start; padding:16px; }
    .page-text { min-width:0; }
    .purpose { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:10px; }
    .purpose > div { padding:9px; border-radius:8px; background:var(--paper-2); }
    .label { display:block; margin-bottom:4px; color:#68758a; font-size:9px; font-weight:800; letter-spacing:.05em; }
    .purpose p { margin:0; font-size:11px; line-height:1.52; }
    .visible-copy { padding:10px; margin-bottom:0; border-left:3px solid #b7c8e9; background:#f8faff; }
    .visible-copy h4 { margin:0 0 7px; font-size:12px; }
    .visible-copy ul { margin:0; padding-left:17px; }
    .visible-copy li { margin:0 0 5px; font-size:11px; line-height:1.52; }
    .visual-evidence { min-width:0; margin-bottom:0; }
    .visual-evidence > img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; border:1px solid #cfd7e3; border-radius:8px; background:#e9edf3; }
    .image-caption { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-top:6px; color:var(--muted); font-size:9px; line-height:1.4; }
    .image-caption b { color:#425169; font-weight:700; }
    .material-map { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:8px; }
    .material-map > div { padding:8px; border:1px solid var(--line); border-radius:8px; background:#fafbfc; }
    .material-map p { margin:0; font-size:10px; line-height:1.48; }
    .material-map .missing { border-color:#efd3d6; background:var(--red-soft); color:#86313a; }
    details { border-top:1px solid var(--line); }
    summary { list-style:none; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; color:#455469; font-size:10px; font-weight:700; cursor:pointer; }
    summary::-webkit-details-marker { display:none; }
    summary:after { content:'＋'; color:#8491a4; font-size:13px; }
    details[open] summary:after { content:'−'; }
    .script { padding:0 12px 12px; color:#334155; font-size:11px; line-height:1.7; }
    .quality { display:grid; grid-template-columns:1fr 1fr; gap:7px; padding:10px 12px; border-top:1px solid var(--line); background:#fbfcfe; }
    .quality p { margin:0; font-size:10px; line-height:1.45; }
    .quality strong { color:var(--green); }
    .quality .warning strong { color:var(--amber); }
    .decision-question { padding:10px 12px; border-top:1px solid var(--line); background:#fffaf2; color:#67421c; font-size:10px; line-height:1.5; }
    .actions { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:8px 10px; border-top:1px solid var(--line); background:#f6f8fb; }
    .action { display:flex; align-items:center; justify-content:center; gap:6px; min-height:42px; border:1px solid #aeb9c8; border-radius:8px; padding:10px 8px; background:#fff; color:#344054; font-size:10px; font-weight:700; line-height:1.2; cursor:pointer; box-shadow:0 1px 2px rgba(23,35,58,.06); transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease,transform .16s ease; }
    .action:before { content:''; width:8px; height:8px; flex:0 0 8px; border:1.5px solid #8290a4; border-radius:50%; background:#fff; }
    .action:hover { border-color:#78879b; background:#fdfefe; color:#17233a; box-shadow:0 3px 8px rgba(23,35,58,.11); transform:translateY(-1px); }
    .action:active { transform:translateY(0) scale(.99); }
    .action:focus-visible { outline:3px solid rgba(39,95,196,.22); outline-offset:2px; border-color:#275fc4; }
    .action.selected { font-weight:800; box-shadow:0 0 0 1px currentColor inset,0 2px 7px rgba(23,35,58,.09); }
    .action.selected:before { border-color:currentColor; background:currentColor; box-shadow:inset 0 0 0 2px #fff; }
    .action.selected[data-value="approved"] { border-color:#27815a; background:#e8f6ef; color:#176a45; }
    .action.selected[data-value="modify"] { border-color:#c76b16; background:#fff1dd; color:#8a4308; }
    .action.selected[data-value="evidence"] { border-color:#c85858; background:#fff0f0; color:#9d3030; }
    .action.selected[data-value="merge"] { border-color:#7660b7; background:#f3efff; color:#5b4695; }
    .feedback-editor { display:none; padding:12px; border-top:1px solid var(--line); background:#f8fafc; }
    .feedback-editor.open { display:block; }
    .feedback-editor-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:7px; }
    .feedback-editor-head b { font-size:11px; }
    .feedback-editor-head span { color:var(--muted); font-size:9px; line-height:1.4; }
    .feedback-editor textarea { display:block; width:100%; min-height:92px; resize:vertical; border:1px solid #bfc9d8; border-radius:8px; padding:9px 10px; background:#fff; color:var(--text); font:inherit; font-size:11px; line-height:1.55; }
    .feedback-editor textarea:focus { outline:2px solid #b8caec; border-color:var(--blue); }
    .feedback-actions { display:flex; align-items:center; justify-content:flex-end; gap:7px; margin-top:8px; }
    .feedback-actions button { border:1px solid var(--line); border-radius:7px; padding:7px 11px; background:#fff; color:#536074; font-size:10px; cursor:pointer; }
    .feedback-actions .save-feedback { border-color:#275fc4; background:#275fc4; color:#fff; }
    .saved-feedback { display:none; align-items:flex-start; justify-content:space-between; gap:10px; padding:10px 12px; border-top:1px solid var(--line); background:#f4f8ff; }
    .saved-feedback.visible { display:flex; }
    .saved-feedback p { margin:0; color:#334155; font-size:10px; line-height:1.55; white-space:pre-wrap; }
    .saved-feedback button { flex:none; border:0; background:transparent; color:var(--blue); font-size:9px; cursor:pointer; }
    .compact-page .page-body { display:none; }
    .compact-page details,.compact-page .quality,.compact-page .decision-question,.compact-page .actions { display:none; }
    .compact-page .page-head { border-bottom:0; }
    .more { width:100%; border:1px dashed #c7d0dc; border-radius:10px; padding:11px; background:transparent; color:#526174; font-size:10px; cursor:pointer; }
    .review-summary { margin-top:14px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
    .review-summary h3 { margin:0 0 7px; font-size:13px; }
    .review-summary p { margin:0; color:var(--muted); font-size:10px; line-height:1.5; }
    .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(80px); z-index:50; width:min(390px,calc(100vw - 30px)); padding:10px 12px; border-radius:9px; background:#17233a; color:#fff; font-size:11px; opacity:0; transition:.2s ease; pointer-events:none; box-shadow:var(--shadow); }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
    @media (max-width:860px) {
      .app { width:100%; }
      .document { padding:13px 12px 40px; }
      .page-body { grid-template-columns:1fr; padding:12px; }
      .visible-copy,.visual-evidence { margin-bottom:10px; }
    }
    @media (max-width:380px) {
      .purpose,.material-map,.quality { grid-template-columns:1fr; }
      .actions { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>

  <main class="app">
    <header class="head">
      <div class="head-main">
        <div class="project"><b>重庆机电智能制造全域数字化解决方案</b><span>全稿视觉决策伴随 · 内容 v3 · 29 页</span></div>
        <div class="review-progress"><b id="reviewedCount">3</b> / 29 已标记</div>
      </div>
      <div class="progress"><span id="progressBar"></span></div>
      <nav id="chapterNav" class="chapter-nav" aria-label="章节快速定位"></nav>
    </header>

    <div class="document">
      <section class="deck-intro">
        <small>本稿要让客户形成的最终判断</small>
        <h1>重庆机电智能制造能够连接经营、生产、装备与数据，并以工程交付能力推动全域数字化分步落地。</h1>
        <p>从企业能力出发，解释客户为什么需要全域协同，再给出完整解决方案、落地路径和案例证据。</p>
        <div class="deck-facts"><span>5 章</span><span>29 页</span><span>阅读优先</span><span>7 页材料待补证</span></div>
      </section>

      <div id="chapters"></div>

      <section class="review-summary">
        <h3>全稿审核收口</h3>
        <p>已展示本原型重点页。正式侧边栏将以同一结构连续呈现全部 29 页，并保留所有可见文字、图片材料、逐字稿与审核标记，不以缩略摘要代替完整内容。</p>
      </section>
    </div>
  </main>
  <div id="toast" class="toast"></div>

        </div>
        <details><summary>完整逐字稿</summary><div class="script">${p.script}</div></details>
        <div class="quality"><p><span class="label">阅读质量</span><strong>${p.quality}</strong></p><p class="${p.missing?'warning':''}"><span class="label">相邻页面关系</span><strong>${p.relation}</strong></p></div>
        <div class="decision-question"><b>待你判断：</b>${p.question}</div>
        <div class="actions" aria-label="P${p.no} 审核标记">
          ${[['approved','认可本页'],['modify','需要修改'],['evidence','证据不足'],['merge','考虑删并']].map(([v,t])=>`<button class="action ${p.mark===v?'selected':''}" data-value="${v}">${t}</button>`).join('')}
        </div>
        <div class="feedback-editor" aria-label="P${p.no} 审核意见输入">
          <div class="feedback-editor-head"><div><b class="feedback-title">写下修改意见</b><br><span>保存后将连同页码、意见类型和本页原文交给 Codex 读取。</span></div></div>
          <textarea maxlength="1200" placeholder="请具体说明哪里不对、希望改成什么，或缺少哪一类证据……"></textarea>
          <div class="feedback-actions"><button class="cancel-feedback">取消</button><button class="save-feedback">保存意见</button></div>
        </div>
        <div class="saved-feedback"><p></p><button class="edit-feedback">编辑意见</button></div>
      </article>`;
    }

    nav.innerHTML=chapters.map(c=>`<button class="nav-btn" data-target="${c.id}">${c.no} ${c.name.split('：')[0]}</button>`).join('');
    host.innerHTML=chapters.map((c,ci)=>`<section id="${c.id}" class="chapter"><div class="chapter-title"><span class="chapter-no">${c.no}</span><div><h2>${c.name}</h2><p>${c.task}</p></div></div>${c.pages.map((p,pi)=>pageMarkup(p,pi>1)).join('')}${c.pages.length>2?`<button class="more">展开本章其余页面</button>`:''}</section>`).join('');

    nav.addEventListener('click',e=>{const b=e.target.closest('.nav-btn');if(!b)return;document.getElementById(b.dataset.target).scrollIntoView({behavior:'smooth'});});
    host.addEventListener('click',e=>{
      const action=e.target.closest('.action');
      if(action){
        const page=action.closest('.page');
        page.querySelectorAll('.action').forEach(x=>x.classList.remove('selected'));
        action.classList.add('selected');
        page.dataset.mark=action.dataset.value;
        const dot=page.querySelector('.mark-dot');
        dot.className=`mark-dot ${action.dataset.value}`;
        const editor=page.querySelector('.feedback-editor');
        if(action.dataset.value!=='approved'){
          editor.classList.add('open');
          editor.querySelector('.feedback-title').textContent=feedbackTitle[action.dataset.value](page.dataset.page);
          setTimeout(()=>editor.querySelector('textarea').focus(),0);
        } else {
          editor.classList.remove('open');
        }
        toast.textContent=`P${page.dataset.page} 已标记：${statusText[action.dataset.value]}。`;
        toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200);
        updateProgress();
      }
      const cancel=e.target.closest('.cancel-feedback');
      if(cancel){cancel.closest('.feedback-editor').classList.remove('open');}
      const save=e.target.closest('.save-feedback');
      if(save){
        const page=save.closest('.page');
        const editor=page.querySelector('.feedback-editor');
        const input=editor.querySelector('textarea');
        const value=input.value.trim();
        if(!value){input.focus();toast.textContent='请先写下具体意见再保存。';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);return;}
        const saved=page.querySelector('.saved-feedback');
        saved.querySelector('p').textContent=`${statusText[page.dataset.mark]}意见：${value}`;
        saved.classList.add('visible');
        editor.classList.remove('open');
        page.dataset.feedback=value;
        toast.textContent=`P${page.dataset.page} 意见已保存，Codex 将读取并纳入下一轮修改。`;
        toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400);
      }
      const edit=e.target.closest('.edit-feedback');
      if(edit){const page=edit.closest('.page');page.querySelector('.feedback-editor').classList.add('open');page.querySelector('textarea').focus();}
      const more=e.target.closest('.more');
      if(more){more.previousElementSibling?.classList.remove('compact-page');more.remove();}
    });

    function updateProgress(){const count=document.querySelectorAll('.page[data-mark]:not([data-mark=""])').length;document.getElementById('reviewedCount').textContent=count;document.getElementById('progressBar').style.width=`${Math.round(count/29*100)}%`;}
    updateProgress();

    const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.target===entry.target.id));}});},{rootMargin:'-120px 0px -65% 0px',threshold:0});
    chapters.forEach(c=>observer.observe(document.getElementById(c.id)));
  </script>
</body>
</html>
