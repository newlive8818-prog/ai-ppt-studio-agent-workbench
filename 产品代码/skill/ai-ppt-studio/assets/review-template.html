<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>@@PAGE_TITLE@@</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b4de8'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='36' font-family='Arial' font-weight='700' fill='white'%3EP%3C/text%3E%3C/svg%3E">
  <style>
    :root{--ink:#15202e;--muted:#667085;--line:#dfe4ec;--paper:#f3f5f9;--panel:#fff;--accent:#5b4de8;--accent2:#17a673;--warn:#d97706;--shadow:0 20px 55px rgba(34,45,70,.11)}
    *{box-sizing:border-box}html{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{margin:0}
    header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .top{max-width:1440px;margin:auto;padding:18px 30px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6d5df4,#4738c9);color:#fff;font-weight:800}.brand b{font-size:18px}.meta{color:var(--muted);font-size:13px;text-align:right}
    main{max-width:1440px;margin:0 auto;padding:36px 30px 90px}.hero{padding:32px 36px;border-radius:22px;background:linear-gradient(120deg,#171c2b 0%,#263356 64%,#385f67 100%);color:#fff;box-shadow:var(--shadow);margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#b7c1ff}.hero h1{font-size:34px;line-height:1.22;margin:10px 0 8px}.hero p{color:#dce3ee;max-width:920px;margin:0;line-height:1.7}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 30px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}.metric small{display:block;color:var(--muted);margin-bottom:7px}.metric strong{font-size:18px}
    .section-title{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:30px 0 14px}.section-title h2{margin:0;font-size:23px}.section-title span{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 6px 22px rgba(25,36,59,.055)}.card h3{font-size:19px;margin:0 0 8px}.kicker{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.06em}.claim{font-size:17px;line-height:1.55;margin:15px 0;padding-left:14px;border-left:3px solid var(--accent)}.label{color:var(--muted);font-size:12px;margin-top:16px}.value{line-height:1.7;margin-top:4px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#eef0ff;color:#493ac7;border-radius:999px;padding:5px 9px;font-size:12px}.direction{min-height:220px;border-top:4px solid var(--accent)}.direction:nth-child(2n){border-top-color:var(--accent2)}
    .asset{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#e9edf4;margin:14px 0}.decision{display:flex;gap:8px;margin-top:18px}.decision button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--ink)}.decision button:hover,.decision button.selected{border-color:var(--accent);color:var(--accent);background:#f2f0ff}
    .feedback{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}.feedback textarea{width:100%;min-height:110px;resize:vertical;border:1px solid #cfd6e2;border-radius:12px;padding:14px;font:inherit}.feedback-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}.primary{border:0;border-radius:11px;background:var(--accent);color:#fff;padding:11px 18px;font-weight:700;cursor:pointer}.secondary{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:11px 18px;cursor:pointer}.status-passed{color:var(--accent2)}.status-open{color:var(--warn)}
    @media(max-width:900px){.summary,.grid{grid-template-columns:1fr}.top{align-items:flex-start}.meta{text-align:left}.top{flex-direction:column}.hero h1{font-size:28px}main{padding:24px 16px 72px}}
  </style>
</head>
<body>
  <header><div class="top"><div class="brand"><div class="mark">P</div><div><b>AI PPT Studio</b><div class="eyebrow">Decision Review</div></div></div><div class="meta">@@HEADER_META@@</div></div></header>
  <main>
    <section class="hero"><div class="eyebrow">@@REVIEW_KIND@@</div><h1>@@PAGE_TITLE@@</h1><p>@@PAGE_DESCRIPTION@@</p></section>
    @@SUMMARY@@
    @@CONTENT@@
    <section class="feedback"><div class="section-title"><h2>自然语言修改意见</h2><span>选择、否决和补充意见会一起导出</span></div><textarea id="feedback" placeholder="例如：保留整体结构，但把第三页的主张改成面向领导决策的价值表达……"></textarea><div class="feedback-actions"><button class="secondary" id="copyDecision">复制决策</button><button class="primary" id="exportDecision">导出决策 JSON</button></div></section>
  </main>
  <script>
    const decisions=[];
    document.querySelectorAll('[data-review-action]').forEach(button=>button.addEventListener('click',()=>{const key=button.dataset.reviewKey;const action=button.dataset.reviewAction;document.querySelectorAll(`[data-review-key="${key}"]`).forEach(x=>x.classList.remove('selected'));button.classList.add('selected');const old=decisions.findIndex(x=>x.key===key);const item={key,action};if(old>=0)decisions[old]=item;else decisions.push(item);}));
    const payload=()=>({project:'@@PROJECT_ID@@',review:'@@REVIEW_KIND@@',decisions,feedback:document.getElementById('feedback').value,created_at:new Date().toISOString()});
    document.getElementById('copyDecision').addEventListener('click',async()=>{await navigator.clipboard.writeText(JSON.stringify(payload(),null,2));});
    document.getElementById('exportDecision').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='ai-ppt-review-decision.json';link.click();URL.revokeObjectURL(link.href);});
  </script>
</body>
</html>
